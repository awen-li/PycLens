[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pybcSEC"
version = "0.1.0"
description = "pybcSEC study tool for collecting Python package artifacts and scanning for bytecode evidence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "PyBC-Sec Authors"}
]
dependencies = []

[project.scripts]
pybcSEC = "cli:main"

[tool.setuptools]
py-modules = [
  "analysis",
  "cli",
  "collectors",
  "scanner",
  "tool_analysis",
  "cpython_fuzz",
  "seed_extract",
  "source_repro",
  "rq1_analysis",
]
package-dir = {"" = "src"}
